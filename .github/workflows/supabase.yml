name: Uppdatera Supabase

# Sätter inloggningsinställningar och kör databasmigreringar (och senare Edge Functions)
# mot Supabase-projektet
# när något under supabase/ ändras på main.
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'scripts/supabase-*', '.github/workflows/supabase.yml']
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: glkphbxspzhwhdveiori
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testa migreringar och RLS lokalt
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createuser --superuser runner
          PGHOST=/var/run/postgresql PGUSER=runner PGDATABASE=postgres scripts/test-db.sh

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Testa Edge Functions
        working-directory: supabase/functions
        run: deno test _shared/ && deno check */index.ts

      - name: Kontrollera hemligheter
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Lägg in SUPABASE_ACCESS_TOKEN och SUPABASE_DB_PASSWORD under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Koppla till projektet
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Kör databasmigreringar
        run: supabase db push --yes

      - name: Uppdatera inloggningsinställningar och mejlmallar
        run: scripts/supabase-auth-config.sh

      - name: Skapa VAPID-nycklar för pushnotiser (bara första gången)
        run: |
          if supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" | grep -q VAPID_PRIVATE_KEY; then
            echo "VAPID-nycklar finns redan."
            exit 0
          fi
          keys=$(npx --yes web-push@3.6.7 generate-vapid-keys --json)
          public=$(echo "$keys" | python3 -c 'import json,sys; print(json.load(sys.stdin)["publicKey"])')
          private=$(echo "$keys" | python3 -c 'import json,sys; print(json.load(sys.stdin)["privateKey"])')
          echo "::add-mask::$private"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" \
            "VAPID_PUBLIC_KEY=$public" \
            "VAPID_PRIVATE_KEY=$private" \
            "VAPID_SUBJECT=https://sakselson-a11y.github.io/hundappen/"
          echo "Nya VAPID-nycklar sparade i Supabase."

      - name: Publicera Edge Functions
        run: supabase functions deploy --use-api --project-ref "$SUPABASE_PROJECT_REF"
